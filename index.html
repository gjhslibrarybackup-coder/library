:root{--bg:#f7f2e7;--c:#fffdf8;--t:#1d2b24;--m:#5d6b63;--g:#0a6446;--g2:#0e8a60;--au:#c9a227;--b:#e3dac3;--r:#b83227;--ok:#177a43;--sh:0 4px 18px #5a4a1a18;--hd:'NikoshBAN','Nikosh','Nikosh GB','Nirmala UI','Vrinda',serif}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#131a16;--c:#1c2520;--t:#eef3ee;--m:#a3b1a9;--g:#2fa77a;--g2:#2fa77a;--b:#34423b;--r:#f0897c;--ok:#52c98a;--sh:0 4px 18px #0007}}
*{box-sizing:border-box}html{font-size:20px;-webkit-text-size-adjust:100%}html,body{margin:0}
body{font:1rem/1.9 'NikoshBAN','Nikosh','Nikosh GB','Nirmala UI','Vrinda','Noto Sans Bengali','Kalpurush','SolaimanLipi',sans-serif;background:var(--bg);background-image:radial-gradient(circle at 8% 0,#c9a22722,transparent 38%),radial-gradient(circle at 100% 100%,#0a64461c,transparent 40%);background-attachment:fixed;color:var(--t);padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
.lb{background:var(--c);border:1px solid var(--b);border-top:6px solid var(--au);border-radius:22px;padding:34px 28px;max-width:440px;width:100%;text-align:center;box-shadow:0 18px 50px #0a64462e}
.lb img{width:160px;filter:drop-shadow(0 4px 8px #0003)}.lb h1{font:700 1.55rem/1.4 var(--hd);margin:12px 0 2px;color:var(--g)}.lb p{margin:4px 0 18px;color:var(--m)}
header{background:linear-gradient(135deg,#084c36,var(--g) 55%,#128a60);color:#fff;display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:5px solid var(--au);box-shadow:var(--sh)}
header img{width:64px;height:64px;background:#fff;border-radius:50%;padding:2px;border:3px solid var(--au)}header b{font:700 1.3rem/1.35 var(--hd);display:block}header small{opacity:.9;font-size:.95rem}header .sp{flex:1}
nav{display:flex;gap:8px;overflow-x:auto;padding:12px 14px;background:var(--c);border-bottom:1px solid var(--b);position:sticky;top:env(safe-area-inset-top,0);z-index:5;box-shadow:var(--sh)}
nav button{white-space:nowrap;background:var(--bg);border:1.5px solid var(--b);color:var(--t);padding:9px 18px;border-radius:999px;font:inherit;font-weight:500;cursor:pointer;transition:.15s}
nav button:hover{border-color:var(--g)}nav button.on{background:var(--g);color:#fff;border-color:var(--g);box-shadow:0 3px 0 var(--au)}
main{max-width:1200px;margin:0 auto;padding:20px 16px}
.card{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:var(--sh)}
h2{font:700 1.5rem/1.4 var(--hd);margin:0 0 16px;color:var(--g)}h2::after{content:"";display:block;width:56px;height:4px;border-radius:4px;background:var(--au);margin-top:6px}h3{font-family:var(--hd);color:var(--g)}
input,select,textarea{font:inherit;padding:11px 14px;border:1.5px solid var(--b);border-radius:10px;background:var(--bg);color:var(--t);width:100%;transition:.15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--au);box-shadow:0 0 0 4px #c9a22744}
label{display:block;font-weight:600;margin:12px 0 4px}
.row{display:flex;gap:14px;flex-wrap:wrap}.row>*{flex:1;min-width:170px}
.btn{background:linear-gradient(180deg,var(--g2),var(--g));color:#fff;border:0;padding:12px 26px;border-radius:12px;font:inherit;font-weight:600;cursor:pointer;margin-top:14px;box-shadow:0 3px 0 #06392a;transition:.12s}
.btn:active{transform:translateY(2px);box-shadow:none}.btn.s{padding:5px 15px;margin:3px;font-size:.92rem;border-radius:9px;box-shadow:none}
.btn.r{background:var(--r);box-shadow:0 3px 0 #7d2019}.btn.s.r{box-shadow:none}.btn.o{background:none;color:var(--g);border:1.5px solid var(--g);box-shadow:none}
.tw{overflow-x:auto;margin-top:12px;border-radius:12px;border:1px solid var(--b)}table{border-collapse:collapse;width:100%}
th,td{padding:12px 14px;border-bottom:1px solid var(--b);text-align:left;vertical-align:top}th{background:var(--g);color:#fff;white-space:nowrap;font-weight:600}
tr:nth-child(even) td{background:#c9a22710}tr:hover td{background:#0a64461a}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px}.st div{background:var(--c);border:1px solid var(--b);border-bottom:4px solid var(--au);border-radius:14px;padding:12px 16px;box-shadow:var(--sh);color:var(--m)}.st b{font:700 2rem/1.3 var(--hd);color:var(--g);display:block}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--r);font-weight:600}.mu{color:var(--m)}
#mw{display:none;position:fixed;inset:0;background:#0009;z-index:20;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px;backdrop-filter:blur(3px)}
#mb{background:var(--c);border-radius:18px;border-top:6px solid var(--au);padding:24px;max-width:600px;width:100%;box-shadow:0 20px 60px #0006}
.tag{display:inline-block;padding:2px 14px;border-radius:14px;color:#fff;font-size:.9rem}
.idc{border:3px double var(--g);border-radius:16px;padding:18px;max-width:440px;margin:auto;text-align:center;background:var(--c)}.idc img.lgo{width:84px}.ph{width:96px;height:120px;object-fit:cover;border:2px solid var(--g);border-radius:8px;background:var(--bg)}
/**/.dt{background:#c9a22722;border-bottom:1px solid var(--b);text-align:center;font-size:.9rem;padding:3px 10px;color:var(--m)}footer{text-align:center;color:var(--m);padding:18px;border-top:1px solid var(--b);margin-top:10px;font-family:var(--hd)}td,th{font-size:1rem}.btn.s{font-size:.95rem;min-height:38px}
@media(max-width:600px){html{font-size:19px}main{padding:12px 10px}.card{padding:16px}header img{width:48px;height:48px}header b{font-size:1.05rem}}
@media print{body.pm #app,body.pm #mw .nopr,.nopr,footer{display:none!important}body.pm #mw{position:static;background:none;display:block!important}body{background:#fff}html{font-size:14px}table{font-size:.85rem}th{background:#ddd!important;color:#000}.card{box-shadow:none}}

/* ===== v2: মার্জিত থিম, স্পষ্ট ফন্ট ===== */
:root{--bg:#f4f1ea;--c:#fff;--t:#1f2a26;--m:#5b6761;--g:#14513f;--g2:#1d6a53;--au:#b08d3c;--b:#e5dfd1;--r:#a8332a;--ok:#1b7a47;--sh:0 1px 2px #1f2a2610,0 6px 20px #1f2a2612;--hd:'Noto Serif Bengali','NikoshBAN','Nikosh',serif;--bf:'Noto Serif Bengali','NikoshBAN','Nikosh','Nirmala UI','Vrinda',sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101613;--c:#18211c;--t:#eef2ee;--m:#a1afa7;--g:#3aa883;--g2:#2f9473;--au:#d1ae5a;--b:#2d3a33;--r:#ef8c80;--ok:#5ccb90;--sh:0 6px 22px #0008}}
html{font-size:18px}
body{font-family:var(--bf);line-height:1.75;background-image:radial-gradient(circle at 0 0,#b08d3c14,transparent 40%),radial-gradient(circle at 100% 100%,#14513f14,transparent 45%)}
.lb{border-top:5px solid var(--au);border-radius:20px;box-shadow:0 20px 56px #14513f26}
header{background:linear-gradient(120deg,#0c3b2f,#14513f 60%,#1d6a53);border-bottom:4px solid var(--au)}
header b{letter-spacing:.2px}
nav{box-shadow:0 2px 10px #1f2a2610}
nav button{font-weight:500;border-width:1px}nav button.on{background:var(--g);box-shadow:none;border-color:var(--g)}
.card{border-radius:14px;border-color:var(--b)}
h2{font-size:1.45rem}h2::after{width:48px;height:3px;background:var(--au)}
th{background:var(--g);font-weight:600;letter-spacing:.2px}td,th{font-size:1rem;padding:11px 14px}
tr:nth-child(even) td{background:#b08d3c0f}tr:hover td{background:#14513f14}
label{font-weight:600;font-size:.98rem}
input,select,textarea{border-width:1px;border-radius:9px}input:focus,select:focus,textarea:focus{border-color:var(--g);box-shadow:0 0 0 3px #14513f26}
.btn{background:var(--g);box-shadow:0 2px 0 #0c3b2f;font-weight:600}.btn.r{background:var(--r);box-shadow:0 2px 0 #6f2019}.btn.o{background:none;color:var(--g);border:1px solid var(--g)}
.st div{border-bottom:3px solid var(--au);border-radius:12px}.st b{font-size:2.1rem}

.cimg{width:100%;display:block;border:1px solid var(--b);border-radius:12px;margin:0 0 12px;box-shadow:var(--sh)}
.bidbox{background:var(--bg);border:1px dashed var(--au);border-radius:10px;padding:8px 16px;margin:14px 0 0}.bidbox b{font-size:1.2rem}

const RQ=['আপনার প্রথম স্কুলের নাম কী?','আপনার মায়ের ডাকনাম কী?','আপনার প্রিয় শিক্ষকের নাম কী?','আপনার জন্মস্থানের নাম কী?','আপনার শৈশবের প্রিয় বইয়ের নাম কী?','আপনার প্রথম মোবাইল নম্বরের শেষ ৪ সংখ্যা কত?'];
const nA=t=>String(t||'').normalize('NFC').toLowerCase().replace(/[\s.,\-_'"“”‘’।!?]/g,'');
async function mkRec(q,a){const t=Math.random().toString(36).slice(2)+Date.now();return{q,s:t,ah:await H(nA(a),t)}}
function rcForm(p){return`<label>নিরাপত্তা প্রশ্ন (পাসওয়ার্ড ভুলে গেলে লাগবে)</label><select id="${p}q" onchange="$('${p}c').style.display=this.value?'none':'block'">${RQ.map(q=>`<option>${q}</option>`).join('')}<option value="">— নিজের প্রশ্ন লিখুন —</option></select><input id="${p}c" placeholder="আপনার নিজের প্রশ্ন" style="display:none;margin-top:6px"><label>উত্তর (মনে রাখার মতো, অন্যের অজানা)</label><input id="${p}a" autocomplete="off">`}
function rcRead(p){const q=$(p+'q').value||$(p+'c').value.trim(),a=$(p+'a').value;return q.length>=5&&nA(a).length>=3?{q,a}:null}
function recSetup(){M(`<h2>🛡 পাসওয়ার্ড পুনরুদ্ধারের প্রশ্ন</h2><p class="mu">এটি সেট থাকলে পাসওয়ার্ড ভুলে গেলেও প্রশ্নের উত্তর দিয়ে নতুন পাসওয়ার্ড বানানো যাবে।</p>${rcForm('r2')}<label>অ্যাডমিন পাসওয়ার্ড</label><input type="password" id="pp"><button class="btn" onclick="recSave()">সংরক্ষণ</button> <button class="btn o" onclick="C()">পরে</button>`)}
async function recSave(){const rc=rcRead('r2');if(!rc)return al('প্রশ্ন ও উত্তর দিন (উত্তর কমপক্ষে ৩ অক্ষর)');if(!await ok($('pp').value))return al('ভুল পাসওয়ার্ড');db.rec=await mkRec(rc.q,rc.a);LG('পুনরুদ্ধারের নিরাপত্তা প্রশ্ন সেট/পরিবর্তন');C();toast('✔ নিরাপত্তা প্রশ্ন সংরক্ষিত');if(tab=='pw')T.pw()}
let FG=null;
async function fg(){if(!CFG.API_URL||CFG.API_URL.startsWith('YOUR_')||SALT===null)return al('সার্ভারের সাথে সংযোগ হয়নি; একটু অপেক্ষা করুন');
 try{const r=await api('recQ');if(!r.ok)return al(r.err=='norec'?'এই ডাটাবেজে পুনরুদ্ধার প্রশ্ন সেট করা নেই। (প্রশাসক Drive-এর library-data.json-এ সরাসরি ব্যবস্থা নিতে পারবেন — README দেখুন)':'ত্রুটি: '+r.err);FG=r;
 M(`<h2>🔑 পাসওয়ার্ড পুনরুদ্ধার</h2><p><b>${E(r.q)}</b></p><label>আপনার উত্তর</label><input id="ga" autocomplete="off"><label>নতুন পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)</label><input type="password" id="g1"><label>নতুন পাসওয়ার্ড আবার</label><input type="password" id="g2"><div id="ge" class="bad"></div><button class="btn" onclick="fgc()">পাসওয়ার্ড পুনঃস্থাপন</button> <button class="btn o" onclick="C()">বাতিল</button><p class="mu" style="font-size:.85rem">ভুল উত্তর ৫ বার হলে ৩০ মিনিট পুনরুদ্ধার বন্ধ থাকবে।</p>`)}catch(x){al('সংযোগ ত্রুটি')}}
async function fgc(){const e=$('ge'),a=$('ga').value,n=$('g1').value;if(nA(a).length<1)return e.textContent='উত্তর লিখুন';if(n.length<6)return e.textContent='নতুন পাসওয়ার্ড কমপক্ষে ৬ অক্ষর';if(n!=$('g2').value)return e.textContent='পাসওয়ার্ড দুটি মিলছে না';e.textContent='যাচাই হচ্ছে…';
 try{const ns=Math.random().toString(36).slice(2)+Date.now(),r=await api('recover',{ah:await H(nA(a),FG.s),nh:await H(n,ns),ns});if(r.ok){SALT=ns;C();$('le').textContent='';al('✔ নতুন পাসওয়ার্ড সেট হয়েছে। এখন সেটি দিয়ে প্রবেশ করুন।');return}
 e.textContent=r.err=='locked'?'অনেকবার ভুল হয়েছে; '+bn(r.mins||30)+' মিনিট পর চেষ্টা করুন':r.err=='auth'?'উত্তর মিলছে না'+(r.left!=null?' (আর '+bn(r.left)+' বার চেষ্টা)':''):'ত্রুটি: '+r.err}catch(x){e.textContent='সংযোগ ত্রুটি'}}

let idl;function idr(){clearTimeout(idl);if(db)idl=setTimeout(()=>{if(db)lo()},15*60000)}
['click','keydown','touchstart'].forEach(v=>addEventListener(v,idr,{passive:true}));
addEventListener('visibilitychange',()=>{if(document.hidden&&dirty&&!saving)gSave()});
